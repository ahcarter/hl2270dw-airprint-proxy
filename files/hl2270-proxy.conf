# /etc/hl2270-proxy.conf -- settings for the HL-2270DW AirPrint proxy.
# install.sh writes this file only if it is absent, so local edits survive re-installs.
# After editing, run: sudo hl2270-setup-queue

# CUPS queue name (also the AirPrint resource: ipp://<pi-hostname>.local/printers/$QUEUE)
QUEUE=HL2270DW
QUEUE_INFO="Brother HL-2270DW"
QUEUE_LOCATION=""

# Printer address, tried first. Set it with: sudo ./install.sh --printer <host or IP>
PRINTER_HOST=
# Optional extra addresses, tried in order when PRINTER_HOST does not connect, so a DHCP
# change or a DNS outage does not stop printing. Good candidates: the printer's mDNS name
# (BRNxxxxxxxxxxxx.local, shown on its network configuration page) and its current IP.
FALLBACK_HOSTS=""
PRINTER_PORT=631
# Brother's raw ("binary") IPP queue. Its IPP server is IPP/1.0 and accepts only
# document-format application/vnd.hp-PCL, which is why the custom bripp backend exists.
PRINTER_PATH=/binary_p1

# Default paper. AirPrint clients can override per job.
PAGE_SIZE=Letter

# Driver. Empty = auto: brlaser's HL-2270DW model, else CUPS Generic PCL Laser.
DRIVER_PPD=
